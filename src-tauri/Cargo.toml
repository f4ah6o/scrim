[package]
name = "scrim-app"
version = "0.1.0"
description = "Scrim - Keyboard-driven desktop navigation"
authors = ["scrim contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fu2hito/scrim"
edition = "2021"
rust-version = "1.75"

[lib]
name = "scrim_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
scrim-core = { path = "../crates/scrim-core" }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.1", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
scrim-macos = { path = "../crates/scrim-macos" }
cocoa = "0.26"
objc = "0.2"
rdev = "0.5"
flume = "0.11"
