[workspace]
resolver = "2"
members = [
    "crates/scrim-core",
    "crates/scrim-macos",
    "crates/scrim-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["scrim contributors"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# macOS dependencies
accessibility = "0.1"
accessibility-sys = "0.1"
core-foundation = "0.9"
cocoa = "0.26"
objc = "0.2"
async-trait = "0.1"
